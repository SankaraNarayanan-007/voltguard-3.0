<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltGuard AI — Sign Up</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="bg"></div>
    <img class="car-bg" src="car-bg.png" alt="" />

    <div class="auth-container">
        <div class="auth-card glass">
            <div class="brand">
                <span class="logo">⚡</span> VoltGuard AI
            </div>
            <h2>Create Account</h2>
            <p class="subtitle">Monitor your EV battery in real-time</p>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signup-name" placeholder="John Doe" />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signup-email" placeholder="you@example.com" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signup-password" placeholder="Min. 6 characters" />
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="signup-confirm" placeholder="Repeat password" />
            </div>

            <div class="form-group">
                <label>Account Type</label>
                <select id="signup-account-type" onchange="toggleAccountFields()">
                    <option value="single">Single EV Owner</option>
                    <option value="fleet">Fleet Owner / Manager</option>
                </select>
            </div>

            <div class="form-group" id="field-vehicle-model">
                <label>Vehicle Model</label>
                <input type="text" id="signup-vehicle-model" placeholder="e.g. Ather 450X" />
            </div>

            <div class="form-group" id="field-fleet-name" style="display:none;">
                <label>Fleet / Company Name</label>
                <input type="text" id="signup-fleet-name" placeholder="e.g. Chennai EV Logistics" />
            </div>
            <div class="form-group" id="field-fleet-size" style="display:none;">
                <label>Number of Vehicles in Fleet</label>
                <input type="number" id="signup-fleet-size" min="1" placeholder="e.g. 12" />
            </div>

            <div id="signup-error" class="error-msg"></div>

            <button class="btn-primary" onclick="handleSignup()">Create Account</button>

            <p class="switch-link">Already have an account? <a href="login.html">Sign In</a></p>
        </div>
    </div>

    <script>
        function toggleAccountFields() {
            const type = document.getElementById('signup-account-type').value;
            document.getElementById('field-vehicle-model').style.display = type === 'single' ? 'block' : 'none';
            document.getElementById('field-fleet-name').style.display = type === 'fleet' ? 'block' : 'none';
            document.getElementById('field-fleet-size').style.display = type === 'fleet' ? 'block' : 'none';
        }

        function handleSignup() {
            const name         = document.getElementById('signup-name').value.trim();
            const email        = document.getElementById('signup-email').value.trim();
            const password     = document.getElementById('signup-password').value;
            const confirm      = document.getElementById('signup-confirm').value;
            const accountType  = document.getElementById('signup-account-type').value;
            const vehicleModel = document.getElementById('signup-vehicle-model').value.trim();
            const fleetName    = document.getElementById('signup-fleet-name').value.trim();
            const fleetSize    = parseInt(document.getElementById('signup-fleet-size').value) || 0;
            const errEl        = document.getElementById('signup-error');

            errEl.innerText = '';

            if (!name || !email || !password || !confirm) {
                errEl.innerText = 'Please fill in all fields.'; return;
            }
            if (password.length < 6) {
                errEl.innerText = 'Password must be at least 6 characters.'; return;
            }
            if (password !== confirm) {
                errEl.innerText = 'Passwords do not match.'; return;
            }
            if (accountType === 'single' && !vehicleModel) {
                errEl.innerText = 'Please enter your vehicle model.'; return;
            }
            if (accountType === 'fleet' && (!fleetName || fleetSize < 1)) {
                errEl.innerText = 'Please enter your fleet name and number of vehicles.'; return;
            }

            // Check if email already registered
            const users = JSON.parse(localStorage.getItem('voltguard_users') || '[]');
            if (users.find(u => u.email === email)) {
                errEl.innerText = 'An account with this email already exists.'; return;
            }

            // Save user
            const userRecord = { name, email, password, accountType, vehicleModel, fleetName, fleetSize };
            users.push(userRecord);
            localStorage.setItem('voltguard_users', JSON.stringify(users));

            // Auto login
            localStorage.setItem('voltguard_session', JSON.stringify({
                name, email, accountType, vehicleModel, fleetName, fleetSize
            }));

            window.location.href = 'index.html';
        }

        // If already logged in, skip to dashboard
        if (localStorage.getItem('voltguard_session')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
