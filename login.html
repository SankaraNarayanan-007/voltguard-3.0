<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltGuard AI — Login</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="bg"></div>
    <img class="car-bg" src="car-bg.png" alt="" />

    <div class="auth-container">
        <div class="auth-card glass">
            <div class="brand">
                <span class="logo">⚡</span> VoltGuard AI
            </div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your dashboard</p>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" placeholder="you@example.com" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Your password" />
            </div>

            <div class="form-group">
                <label>Sign In As</label>
                <select id="login-account-type">
                    <option value="single">Single EV Owner</option>
                    <option value="fleet">Fleet Owner / Manager</option>
                </select>
            </div>

            <div id="login-error" class="error-msg"></div>

            <button class="btn-primary" onclick="handleLogin()">Sign In</button>

            <p class="switch-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
    </div>

    <script>
        function handleLogin() {
            const email       = document.getElementById('login-email').value.trim();
            const password    = document.getElementById('login-password').value;
            const accountType = document.getElementById('login-account-type').value;
            const errEl       = document.getElementById('login-error');

            errEl.innerText = '';

            if (!email || !password) {
                errEl.innerText = 'Please fill in all fields.'; return;
            }

            const users = JSON.parse(localStorage.getItem('voltguard_users') || '[]');
            const user  = users.find(u => u.email === email && u.password === password);

            if (!user) {
                errEl.innerText = 'Invalid email or password.'; return;
            }

            // Keep the account's stored type in sync with what was picked at sign-in
            user.accountType = accountType;
            const userIndex = users.findIndex(u => u.email === email);
            if (userIndex > -1) { users[userIndex] = user; }
            localStorage.setItem('voltguard_users', JSON.stringify(users));

            localStorage.setItem('voltguard_session', JSON.stringify({
                name: user.name,
                email: user.email,
                accountType: accountType,
                vehicleModel: user.vehicleModel || '',
                fleetName: user.fleetName || '',
                fleetSize: user.fleetSize || 0
            }));
            window.location.href = 'index.html';
        }

        // Enter key support
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') handleLogin();
        });

        // If already logged in, skip to dashboard
        if (localStorage.getItem('voltguard_session')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
